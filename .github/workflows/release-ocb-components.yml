name: Automation - Test and Release OLTP components

on:
  push:
  workflow_dispatch:
    inputs:
      candidate-version:
        required: true
        description: Release candidate version (beta, like 0.70.0)

permissions:
  id-token: write
  contents: read

jobs:
  setup-test-for-prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-ocb-dev-workflows

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.RELEASE_TEST_ACCOUNT_ID }}:role/${{ secrets.RELEASE_TEST_ACCOUNT_ROLE }}
          aws-region: us-east-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to private AWS ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.RELEASE_TEST_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
        env:
          AWS_REGION: us-east-1

      - name: Build and push image according to input
        uses: docker/build-push-action@v5
        with:
          push: true
          context: ./ocb-utils/
          file: ./ocb-utils/Dockerfile
          platforms: linux/amd64
          tags: ${{ secrets.RELEASE_TEST_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/ocb-release-test-collector:${{ github.sha }}
          load: false
          cache-from: type=gha,scope=build-${{ github.ref_name }}-ocb
          cache-to: type=gha,scope=build-${{ github.ref_name }}-ocb

  # ocb-e2e-test:
  #   secrets: inherit
  #   needs: [ setup-test-for-prepare-release ]
  #   uses: jj22ee/aws-application-signals-test-framework/.github/workflows/java-eks-otlp-ocb-test.yml@otlp-ocb-main-build
  #   with:
  #     aws-region: us-east-1
  #     test-cluster-name: 'e2e-otel-collector-contrib-release-test'
  #     caller-workflow-name: 'main-build-java-e2e-eks-otlp-ocb-canary-test'
  #     java-version: '11'
  #     e2e-otel-collector-image-tag: ${{ github.sha }}

  prepare-release:
    runs-on: ubuntu-latest
    needs: [ setup-test-for-prepare-release ]
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-ocb-dev-workflows

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.RELEASE_TEST_ACCOUNT_ID }}:role/${{ secrets.RELEASE_TEST_ACCOUNT_ROLE }}
          aws-region: us-east-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to private AWS ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.RELEASE_TEST_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
        env:
          AWS_REGION: us-east-1

      - name: Build and push image with latest tag
        uses: docker/build-push-action@v5
        with:
          push: true
          context: ./ocb-utils/
          file: ./ocb-utils/Dockerfile
          platforms: linux/amd64
          tags: ${{ secrets.RELEASE_TEST_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/ocb-release-test-collector:latest
          load: false
          cache-from: type=gha,scope=build-${{ github.ref_name }}-ocb
          cache-to: type=gha,scope=build-${{ github.ref_name }}-ocb

      - name: if test passed, create tags PR
        run: |
          echo "hi"

      - name: Tag package
        run: git tag test/v0.0.2
      - name: Publish tags
        run: git push --tags